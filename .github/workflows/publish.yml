name: Publish Package

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref to publish, for example v0.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.release_ref }}
  cancel-in-progress: false

jobs:
  # Shared version gate for both registries; npm-only checks live in publish-npm.
  verify:
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.release.outputs.release_commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.event.inputs.release_ref }}
          fetch-depth: 0

      - name: Verify release tag and version
        id: release
        env:
          RELEASE_REF: ${{ github.event.inputs.release_ref }}
        run: |
          set -euo pipefail

          if ! git rev-parse -q --verify "refs/tags/${RELEASE_REF}" >/dev/null; then
            echo "::error::release_ref must be an existing tag, got '${RELEASE_REF}'"
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          PLUGIN_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('openclaw.plugin.json', 'utf8')).version")"
          SERVICE_VERSION="$(node -p "(require('fs').readFileSync('src/config/version.ts','utf8').match(/PACKAGE_VERSION\\s*=\\s*\"([^\"]+)\"/)||[])[1] || ''")"

          if [ "${RELEASE_REF}" != "v${PACKAGE_VERSION}" ]; then
            echo "::error::Tag ${RELEASE_REF} does not match package.json version v${PACKAGE_VERSION}"
            exit 1
          fi

          if [ "${PLUGIN_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::openclaw.plugin.json version (${PLUGIN_VERSION}) does not match package.json (${PACKAGE_VERSION})"
            exit 1
          fi

          if [ "${SERVICE_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::src/config/version.ts PACKAGE_VERSION (${SERVICE_VERSION}) does not match package.json (${PACKAGE_VERSION})"
            exit 1
          fi

          RELEASE_COMMIT="$(git rev-list -n 1 "${RELEASE_REF}")"
          echo "release_commit=${RELEASE_COMMIT}" >> "$GITHUB_OUTPUT"

  build-clawpack:
    needs: verify
    uses: ./.github/workflows/build-clawpack.yml
    with:
      ref: ${{ github.event.inputs.release_ref }}

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.event.inputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check version not already on npm
        env:
          RELEASE_REF: ${{ github.event.inputs.release_ref }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")"
          PACKAGE_VERSION="${RELEASE_REF#v}"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::error::Version ${PACKAGE_VERSION} is already published to npm"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public

  # Not ClawHub's reusable workflow: it tag-pins actions, which org policy blocks.
  # Keep this a direct job; trusted publishing rejects any other reusable workflow.
  publish-clawhub:
    needs:
      - verify
      - build-clawpack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write  # ClawHub trusted publishing, once CLAWHUB_TOKEN is removed
    steps:
      - name: Download ClawPack
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: clawpack
          path: ${{ runner.temp }}/clawpack

      - name: Check out ClawHub CLI
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: openclaw/clawhub
          ref: 87ca030c30f3cfb78ab15c8e66b5ff1469c8f9c8  # v0.23.3
          path: clawhub-source
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.10

      - name: Install ClawHub CLI dependencies
        working-directory: clawhub-source
        run: bun install --frozen-lockfile

      - name: Validate ClawPack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clawpack-root"
          tar -xzf "$RUNNER_TEMP"/clawpack/*.tgz -C "$RUNNER_TEMP/clawpack-root" --strip-components=1
          bun clawhub-source/packages/clawhub/src/cli.ts package validate "$RUNNER_TEMP/clawpack-root" --out "$RUNNER_TEMP/plugin-inspector"

      - name: Upload plugin inspector reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: plugin-inspector-report
          path: ${{ runner.temp }}/plugin-inspector
          if-no-files-found: ignore

      - name: Publish to ClawHub
        env:
          # Optional: only for the first publish, before OIDC trusted publishing is set up.
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          RELEASE_REF: ${{ github.event.inputs.release_ref }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
        run: |
          set -euo pipefail
          args=(
            --owner coreweave
            --source-repo "$GITHUB_REPOSITORY"
            --source-commit "$RELEASE_COMMIT"
            --source-ref "refs/tags/$RELEASE_REF"
            --wait
            --json
          )
          if [ -n "$CLAWHUB_TOKEN" ]; then
            export CLAWHUB_CONFIG_PATH="$RUNNER_TEMP/clawhub-config.json"
            (umask 077 && jq -n '{registry: "https://clawhub.ai", token: env.CLAWHUB_TOKEN}' > "$CLAWHUB_CONFIG_PATH")
            args+=(--manual-override-reason "GitHub Actions $GITHUB_EVENT_NAME publish via CLAWHUB_TOKEN")
          fi
          bun clawhub-source/packages/clawhub/src/cli.ts package publish "$RUNNER_TEMP"/clawpack/*.tgz "${args[@]}"
