name: ClawHub Validate

# Dry-run ClawHub publish to catch packaging/metadata errors before release.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-clawpack:
    uses: ./.github/workflows/build-clawpack.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  # Mirrors publish-clawhub in publish.yml, with --dry-run in place of the upload.
  dry-run:
    needs: build-clawpack
    runs-on: ubuntu-latest
    steps:
      - name: Download ClawPack
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: clawpack
          path: ${{ runner.temp }}/clawpack

      - name: Check out ClawHub CLI
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: openclaw/clawhub
          ref: 87ca030c30f3cfb78ab15c8e66b5ff1469c8f9c8  # v0.23.3
          path: clawhub-source
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.10

      - name: Install ClawHub CLI dependencies
        working-directory: clawhub-source
        run: bun install --frozen-lockfile

      - name: Validate ClawPack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clawpack-root"
          tar -xzf "$RUNNER_TEMP"/clawpack/*.tgz -C "$RUNNER_TEMP/clawpack-root" --strip-components=1
          bun clawhub-source/packages/clawhub/src/cli.ts package validate "$RUNNER_TEMP/clawpack-root" --out "$RUNNER_TEMP/plugin-inspector"

      - name: Upload plugin inspector reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: plugin-inspector-report
          path: ${{ runner.temp }}/plugin-inspector
          if-no-files-found: ignore

      - name: Dry-run publish
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref }}
        run: |
          bun clawhub-source/packages/clawhub/src/cli.ts package publish "$RUNNER_TEMP"/clawpack/*.tgz \
            --owner coreweave \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" \
            --source-ref "$SOURCE_REF" \
            --dry-run \
            --json
